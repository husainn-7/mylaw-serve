name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (no PyTorch needed, tests use fake engines)
        run: pip install numpy faiss-cpu fastapi uvicorn httpx psutil pytest
      - name: Run tests
        run: pytest -q
